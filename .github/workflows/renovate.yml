name: Renovate
on:
  # Allows manual triggering
  workflow_dispatch:
  # Runs automatically every hour
  schedule:
    - cron: '0 * * * *'

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment: RENOVATE_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: juliustan88/tkg
          # Required for fetching release notes/changelogs from open-source public repos
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}